<!doctype html>
<html lang="en" data-rgb="on"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Write-ups // OFFSEC By Vijay</title>
<meta name="description" content="SOC, TryHackMe and HackTheBox write-ups.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--bg:#0a111c;--panel:#111b2a;--panel2:#16233a;--field:#0b1320;--line:#1e2c42;--row:#18253a;--txt:#e6edf6;--muted:#8391a7;--green:#9fef00;--cyan:#00e5ff;--mag:#ff2bd6;--red:#ff3e5b;--amber:#ffb800;--violet:#8f5bff;
--rgb:linear-gradient(90deg,var(--green),var(--cyan),var(--violet),var(--mag),var(--green));
--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--disp:"Rajdhani","Segoe UI",system-ui,sans-serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;min-height:100%;color:var(--txt);font:15px/1.6 var(--sans);background:
 radial-gradient(900px 500px at 85% -10%,#00e5ff14,transparent 60%),radial-gradient(800px 500px at 10% 110%,#9fef0012,transparent 60%),
 linear-gradient(#ffffff05 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,#ffffff05 1px,transparent 1px) 0 0/28px 28px,var(--bg);background-attachment:fixed}
html[data-rgb="on"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000018 2px 3px)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
::selection{background:var(--green);color:#000}
a{color:var(--cyan)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0a111ce6;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
html[data-rgb="on"] .bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--rgb);background-size:300% 100%;animation:flow 8s linear infinite}
.barin{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--txt);margin-right:auto}
.logo{position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:9px;color:var(--green);font:800 14px var(--mono);isolation:isolate;flex-shrink:0}
.logo::before{content:"";position:absolute;inset:-2px;border-radius:11px;background:conic-gradient(from var(--a),var(--green),var(--cyan),var(--violet),var(--mag),var(--green));z-index:-2;animation:spin 4s linear infinite}
.logo::after{content:"";position:absolute;inset:0;border-radius:9px;background:var(--panel);z-index:-1}
.brand b{font:700 19px var(--disp);letter-spacing:.4px}
.links{display:flex;gap:4px}
.links a{color:#a9b5c7;text-decoration:none;font:600 15px var(--disp);padding:6px 12px;border-radius:7px}
.links a:hover{color:#fff;background:var(--panel)}
.links a.on{color:var(--green);background:#9fef0014}
.wrap{max-width:1180px;margin:0 auto;padding:30px 20px 60px}

.btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:8px 14px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font:600 14px var(--disp);letter-spacing:.4px;text-decoration:none;transition:border-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--green);box-shadow:0 0 14px #9fef0026}
.btn.lime{background:var(--green);border-color:var(--green);color:#0a111c}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.muted{color:var(--muted)}
.ey{font:600 11px var(--mono);color:var(--green);letter-spacing:2px}.ey::before{content:"// "}
h1.big{font:700 44px/1.05 var(--disp);margin:6px 0 8px}
html[data-rgb="on"] h1.big{background:var(--rgb);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 10s linear infinite}
.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.hero p{margin:0;color:var(--muted);max-width:620px}
.term{font:13px var(--mono);background:#060b13;border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin-bottom:22px;overflow-x:auto;white-space:nowrap}
.term .p{color:var(--green)}.term .h{color:var(--cyan)}
.cursor{display:inline-block;width:8px;height:15px;background:var(--green);vertical-align:-2px;margin-left:4px;animation:blink 1s steps(1) infinite}

.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.search{flex:1;min-width:220px;position:relative}
.search::before{content:">";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--green);font:700 14px var(--mono)}
.search input{width:100%;background:var(--field);color:var(--txt);border:1px solid var(--line);padding:10px 12px 10px 28px;border-radius:8px;font:13px var(--mono)}
.search input:focus{border-color:var(--green);outline:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:8px;font:600 12px var(--mono)}
.chip.on{border-color:var(--green);color:var(--green);background:#9fef0014}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--panel),#0e1624);border:1px solid var(--line);border-radius:12px}
.post{padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--txt);position:relative;overflow:hidden;transition:border-color .15s,transform .15s}
.post::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--c,var(--green));box-shadow:0 0 12px var(--c,var(--green))}
.post:hover{border-color:var(--c,var(--green));transform:translateY(-2px)}
.post h3{margin:0;font:700 22px/1.15 var(--disp)}
.post p{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font:11px var(--mono);color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font:600 10px var(--mono);letter-spacing:.6px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 10%,transparent);white-space:nowrap}
.t-thm{color:var(--red)}.t-htb{color:var(--green)}.t-oth{color:var(--violet)}
.d-easy{color:var(--green)}.d-medium{color:var(--amber)}.d-hard{color:var(--red)}.d-insane{color:var(--mag)}
.draft{color:var(--amber)}
.tagtxt{color:var(--cyan);font:11px var(--mono)}
.empty{text-align:center;color:var(--muted);padding:44px 20px;border:1px dashed var(--line);border-radius:12px;font:13px var(--mono)}

/* article */
.article{max-width:820px;margin:0 auto}
.back{font:600 12px var(--mono);color:var(--muted);text-decoration:none}.back:hover{color:var(--green)}
.article h1{font:700 42px/1.1 var(--disp);margin:14px 0 12px}
.article .meta{margin-bottom:24px;font-size:12px}
.mdview{line-height:1.75;font-size:16px;overflow-wrap:anywhere}
.mdview h1,.mdview h2,.mdview h3{font-family:var(--disp);margin:1.3em 0 .4em;line-height:1.2}.mdview h1{font-size:32px}.mdview h2{font-size:26px;color:var(--cyan)}.mdview h3{font-size:20px;color:var(--green)}
.mdview code{font:14px var(--mono);background:#060b13;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--green)}
.mdview pre{background:#060b13;border:1px solid var(--line);border-left:3px solid var(--green);border-radius:8px;padding:16px;overflow-x:auto}
.mdview pre code{border:0;padding:0;background:none;color:#d6f5b0}
.mdview blockquote{margin:0;padding:8px 16px;border-left:3px solid var(--mag);color:var(--muted);background:#ff2bd60a;border-radius:0 8px 8px 0}
.mdview img{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.mdview table{border-collapse:collapse;display:block;overflow-x:auto}.mdview th,.mdview td{border:1px solid var(--line);padding:7px 12px}
.mdview hr{border:0;height:1px;background:var(--line);margin:28px 0}

/* editor */
.edgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{padding:18px}
.f{display:block;margin-bottom:12px}
.f span{display:block;font:600 10px var(--mono);letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.in{width:100%;background:var(--field);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:9px 10px}
.in:focus{border-color:var(--green);outline:0}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
textarea.in{resize:vertical}
.body{min-height:460px;background:#060b13;color:#d6f5b0;font:13px/1.7 var(--mono)}
.prev{max-height:780px;overflow:auto}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--green)}

.foot{border-top:1px solid var(--line);margin-top:40px;padding:18px 20px;text-align:center;font:11px var(--mono);color:var(--muted)}
.foot button{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;padding:0 4px}
.foot button:hover{color:var(--green)}
.toast{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#060b13;color:var(--green);border:1px solid var(--green);box-shadow:0 0 20px #9fef0040;padding:11px 16px;border-radius:8px;display:none;z-index:60;max-width:calc(100% - 48px);font:12px var(--mono)}
.toast.bad{color:var(--red);border-color:var(--red);box-shadow:0 0 20px #ff3e5b40}
.toast.show{display:block}
.modal{position:fixed;inset:0;background:#02060cc0;backdrop-filter:blur(3px);display:none;place-items:center;z-index:70;padding:20px}
.modal.show{display:grid}
.modal .box{max-width:420px;width:100%;padding:22px;border-color:var(--green)}
.modal h3{margin:0 0 8px;font:700 20px var(--disp)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

@keyframes spin{to{--a:360deg}}
@keyframes flow{to{background-position:300% 0}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:900px){.edgrid{grid-template-columns:1fr}.prev{max-height:none}}
@media(max-width:640px){.barin{flex-wrap:wrap;gap:8px;padding:10px 14px}.links{width:100%;overflow-x:auto}.wrap{padding:20px 14px 50px}h1.big{font-size:34px}.article h1{font-size:32px}.row3{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header class="bar"><div class="barin">
 <a class="brand" href="../"><span class="logo">&gt;_</span><b id="siteName">OFFSEC By Vijay</b></a>
 <nav class="links"><a href="../">Home</a><a href="./" class="on">Write-ups</a><a href="../soc/">SOC Center</a></nav>
 <div id="adminBar" hidden><button class="btn sm lime" onclick="location.hash='#/new'">+ New</button></div>
</div></header>
<main class="wrap" id="app"></main>
<footer class="foot">© <span id="yr"></span> <span id="siteName2">OFFSEC By Vijay</span> · Write-ups cover retired / public content only.<br><span id="adminFoot"><button onclick="adminLogin()">Admin</button></span></footer>
<div id="toast" class="toast" role="status"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true"><div class="card box"><h3 id="mtitle"></h3><div id="mbody" class="muted"></div><div class="acts" id="mact"></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
/* ===== SITE SETTINGS ===== */
const SITE_NAME = "OFFSEC By Vijay";
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD0uDbhkIlct7BUUBQTcuG_F75ZbeV6Y9A",
  authDomain: "soc-l1cc.firebaseapp.com",
  projectId: "soc-l1cc",
  storageBucket: "soc-l1cc.firebasestorage.app",
  messagingSenderId: "94446378090",
  appId: "1:94446378090:web:e3fe1bd60fdccbe8f93e13"
};
/* ========================= */
document.getElementById('siteName').textContent=SITE_NAME;document.getElementById('siteName2').textContent=SITE_NAME;document.getElementById('yr').textContent=new Date().getFullYear();
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(src){try{if(window.marked&&window.DOMPurify)return DOMPurify.sanitize(marked.parse(src||''))}catch(e){}return '<pre>'+esc(src)+'</pre>'}
let tT;function msg(t,bad){const e=$('toast');e.textContent=(bad?'[!] ':'[✓] ')+t;e.className='toast show'+(bad?' bad':'');clearTimeout(tT);tT=setTimeout(()=>e.className='toast',2600)}
function ask(title,body,btns){const m=$('modal');$('mtitle').textContent=title;$('mbody').textContent=body;const a=$('mact');a.innerHTML='';btns.forEach(b=>{const e=document.createElement('button');e.className='btn'+(b.cls?' '+b.cls:'');e.textContent=b.label;e.onclick=()=>{m.classList.remove('show');b.fn&&b.fn()};a.appendChild(e)});m.classList.add('show')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=s=>{if(!s)return '';const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})};
const PLAT={TryHackMe:'t-thm',HackTheBox:'t-htb',Other:'t-oth'};
const platTag=p=>'<span class="tag '+(PLAT[p]||'t-oth')+'">'+esc(p||'Other')+'</span>';
const diffTag=d=>d?'<span class="tag d-'+esc(d.toLowerCase())+'">'+esc(d)+'</span>':'';
const accent=p=>p==='TryHackMe'?'var(--red)':p==='HackTheBox'?'var(--green)':'var(--violet)';

let AUTH=null,DB=null,ADMIN=false,POSTS=[],LOADED=false,FILTER='All',Q='';
function ready(){return window.firebase&&FIREBASE_CONFIG.apiKey&&!/PASTE/.test(FIREBASE_CONFIG.apiKey)}

async function load(){
 if(!DB){POSTS=[];LOADED=true;return}
 try{
  let snap;
  if(ADMIN){snap=await DB.collection('writeups').get()}
  else{snap=await DB.collection('writeups').where('published','==',true).get()}
  POSTS=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.updated||0)-(a.updated||0));
 }catch(e){POSTS=[];console.error(e);if(ADMIN)msg('Could not load write-ups — check Firestore rules',true)}
 LOADED=true;
}

function viewList(){
 const q=Q.toLowerCase();
 const list=POSTS.filter(p=>(FILTER==='All'||p.platform===FILTER)&&((p.title||'')+' '+(p.summary||'')+' '+(p.tags||[]).join(' ')).toLowerCase().includes(q));
 const counts=n=>n==='All'?POSTS.length:POSTS.filter(p=>p.platform===n).length;
 $('app').innerHTML='<div class="term" aria-hidden="true"><span class="p">visitor@'+esc(SITE_NAME.toLowerCase().replace(/[^a-z0-9]+/g,'-'))+'</span>:<span class="h">~/writeups</span>$ ls -la<span class="cursor"></span></div>'+
 '<div class="hero"><div><div class="ey">FIELD REPORTS</div><h1 class="big">Write-ups</h1><p>Investigations and walkthroughs from TryHackMe, HackTheBox and SOC labs — approach, evidence, detections and lessons learned.</p></div></div>'+
 '<div class="tools"><div class="search"><input id="q" placeholder="grep write-ups, tags…" aria-label="Search write-ups"></div><div class="chips">'+
 ['All','TryHackMe','HackTheBox','Other'].map(n=>'<button class="chip'+(FILTER===n?' on':'')+'" data-f="'+n+'">'+n+' · '+counts(n)+'</button>').join('')+'</div></div>'+
 (!LOADED?'<div class="empty">Loading…</div>':list.length?'<div class="grid">'+list.map(p=>
  '<a class="card post" style="--c:'+accent(p.platform)+'" href="#/p/'+encodeURIComponent(p.id)+'"><div class="meta">'+platTag(p.platform)+diffTag(p.difficulty)+(p.published?'':'<span class="tag draft">DRAFT</span>')+'<span>'+fmt(p.date)+'</span></div><h3>'+esc(p.title||'Untitled')+'</h3>'+(p.summary?'<p>'+esc(p.summary)+'</p>':'')+
  ((p.tags||[]).length?'<div class="tagtxt">'+p.tags.map(t=>'#'+esc(t)).join(' ')+'</div>':'')+'</a>').join('')+'</div>'
 :'<div class="empty">'+(POSTS.length?'No write-ups match your search.':'No write-ups published yet — check back soon.')+'</div>');
 const qi=$('q');qi.value=Q;qi.oninput=e=>{Q=e.target.value;const pos=e.target.selectionStart;viewList();const n=$('q');n.focus();n.setSelectionRange(pos,pos)};
 document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{FILTER=c.dataset.f;viewList()});
 document.title='Write-ups // '+SITE_NAME;
}

async function viewPost(id){
 let p=POSTS.find(x=>x.id===id);
 if(!p&&DB){try{const d=await DB.collection('writeups').doc(id).get();if(d.exists)p={id:d.id,...d.data()}}catch(e){}}
 if(!p){$('app').innerHTML='<div class="article"><a class="back" href="#/">← cd ../writeups</a><div class="empty" style="margin-top:20px">Write-up not found.</div></div>';return}
 $('app').innerHTML='<article class="article"><a class="back" href="#/">← cd ../writeups</a><h1>'+esc(p.title||'Untitled')+'</h1>'+
 '<div class="meta">'+platTag(p.platform)+diffTag(p.difficulty)+(p.published?'':'<span class="tag draft">DRAFT</span>')+'<span>'+fmt(p.date)+'</span>'+((p.tags||[]).length?'<span class="tagtxt">'+p.tags.map(t=>'#'+esc(t)).join(' ')+'</span>':'')+
 (ADMIN?'<a class="btn sm" href="#/edit/'+encodeURIComponent(p.id)+'" style="margin-left:auto">✎ Edit</a>':'')+'</div>'+
 '<div class="mdview">'+md(p.body||'')+'</div></article>';
 document.title=(p.title||'Write-up')+' // '+SITE_NAME;window.scrollTo(0,0);
}

function slugify(s){return (s||'writeup').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'writeup'}
function viewEdit(id){
 if(!ADMIN){location.hash='#/';return}
 const p=id?POSTS.find(x=>x.id===id):null;
 if(id&&!p){$('app').innerHTML='<div class="empty">Write-up not found.</div>';return}
 const v=p||{title:'',platform:'TryHackMe',difficulty:'Easy',date:today(),tags:[],summary:'',body:'## Scenario\n\n## Investigation\n\n```\n# queries / commands\n```\n\n## Findings\n\n## Detection & response\n\n## Lessons learned\n',published:false};
 $('app').innerHTML='<a class="back" href="'+(p?'#/p/'+encodeURIComponent(p.id):'#/')+'">← back</a><div class="hero" style="margin-top:10px"><div><div class="ey">ADMIN</div><h1 class="big" style="font-size:34px">'+(p?'Edit write-up':'New write-up')+'</h1></div>'+
 '<div style="display:flex;gap:8px;flex-wrap:wrap">'+(p?'<button class="btn" id="bDel">Delete</button>':'')+'<button class="btn lime" id="bSave">Save</button></div></div>'+
 '<div class="edgrid"><div class="card panel">'+
 '<label class="f"><span>Title</span><input class="in" id="eTitle"></label>'+
 '<div class="row3"><label class="f"><span>Platform</span><select class="in" id="ePlat"><option>TryHackMe</option><option>HackTheBox</option><option>Other</option></select></label>'+
 '<label class="f"><span>Difficulty</span><select class="in" id="eDiff"><option value="">—</option><option>Easy</option><option>Medium</option><option>Hard</option><option>Insane</option></select></label>'+
 '<label class="f"><span>Date</span><input class="in" type="date" id="eDate"></label></div>'+
 '<label class="f"><span>Tags (comma separated)</span><input class="in" id="eTags" placeholder="phishing, splunk, mitre"></label>'+
 '<label class="f"><span>Short summary (shown on the card)</span><textarea class="in" id="eSum" rows="2"></textarea></label>'+
 '<label class="f"><span>Body — Markdown</span><textarea class="in body" id="eBody"></textarea></label>'+
 '<label class="check"><input type="checkbox" id="ePub"> Published (visible to everyone)</label>'+
 '</div><div class="card panel prev"><div class="ey" style="margin-bottom:10px">LIVE PREVIEW</div><div class="mdview" id="ePrev"></div></div></div>';
 $('eTitle').value=v.title;$('ePlat').value=v.platform||'TryHackMe';$('eDiff').value=v.difficulty||'';$('eDate').value=v.date||today();$('eTags').value=(v.tags||[]).join(', ');$('eSum').value=v.summary||'';$('eBody').value=v.body||'';$('ePub').checked=!!v.published;
 const upd=()=>{$('ePrev').innerHTML='<h1>'+esc($('eTitle').value||'Untitled')+'</h1>'+md($('eBody').value)};upd();
 $('eTitle').oninput=upd;$('eBody').oninput=upd;
 $('eBody').onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();const b=e.target,s=b.selectionStart;b.setRangeText('  ',s,b.selectionEnd,'end');upd()}};
 $('bSave').onclick=async()=>{
  const data={title:$('eTitle').value.trim()||'Untitled',platform:$('ePlat').value,difficulty:$('eDiff').value,date:$('eDate').value||today(),
   tags:$('eTags').value.split(',').map(t=>t.trim()).filter(Boolean),summary:$('eSum').value.trim(),body:$('eBody').value,published:$('ePub').checked,updated:Date.now()};
  const btn=$('bSave');btn.disabled=true;
  try{let docId=p?p.id:slugify(data.title)+'-'+Date.now().toString(36).slice(-4);
   await DB.collection('writeups').doc(docId).set(data);
   await load();msg(data.published?'Published':'Saved as draft');location.hash='#/p/'+encodeURIComponent(docId);
  }catch(e){msg(e.code==='permission-denied'?'Not allowed — this account is not the site admin (check Firestore rules).':'Save failed: '+e.message,true)}
  btn.disabled=false};
 if(p)$('bDel').onclick=()=>ask('Delete this write-up?','"'+(p.title||'Untitled')+'" will be removed permanently.',[{label:'Cancel'},{label:'Delete',cls:'lime',fn:async()=>{try{await DB.collection('writeups').doc(p.id).delete();await load();msg('Deleted');location.hash='#/'}catch(e){msg('Delete failed: '+e.message,true)}}}]);
 document.title=(p?'Edit':'New')+' write-up // '+SITE_NAME;window.scrollTo(0,0);
}

function route(){const h=location.hash||'#/';
 if(h.startsWith('#/p/'))return viewPost(decodeURIComponent(h.slice(4)));
 if(h==='#/new')return viewEdit(null);
 if(h.startsWith('#/edit/'))return viewEdit(decodeURIComponent(h.slice(7)));
 viewList()}
window.addEventListener('hashchange',route);

/* Admin: only accounts allowed by the Firestore rules can see drafts & publish */
let WANT_ADMIN=false;
async function checkAdmin(){
 ADMIN=false;
 if(!AUTH||!AUTH.currentUser)return;
 try{await DB.collection('writeups').where('published','==',false).limit(1).get();ADMIN=true}catch(e){ADMIN=false}
}
function setAdminUI(){$('adminBar').hidden=!ADMIN;$('adminFoot').innerHTML=ADMIN?'Admin: '+esc(AUTH.currentUser.email||'')+' <button onclick="adminLogout()">Sign out</button>':'<button onclick="adminLogin()">Admin</button>'}
async function adminLogin(){
 if(!AUTH){msg('Firebase is not configured',true);return}
 WANT_ADMIN=true;
 try{if(!AUTH.currentUser)await AUTH.signInWithPopup(new firebase.auth.GoogleAuthProvider());else{await afterAuth()}}
 catch(e){msg(e.code==='auth/unauthorized-domain'?'Add this domain in Firebase → Authentication → Authorized domains':'Sign-in failed: '+(e.message||e),true)}
}
function adminLogout(){AUTH.signOut()}
async function afterAuth(){
 await checkAdmin();setAdminUI();
 if(WANT_ADMIN&&!ADMIN&&AUTH.currentUser)msg('Signed in, but this account is not the site admin',true);
 WANT_ADMIN=false;await load();route();
}

if(ready()){firebase.initializeApp(FIREBASE_CONFIG);AUTH=firebase.auth();DB=firebase.firestore();AUTH.onAuthStateChanged(()=>afterAuth());}
else{LOADED=true;}
route();
</script></body></html>
